services:
  postgres:
    image: postgres:18-alpine
    container_name: onedep-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: onedep
      POSTGRES_USER: onedep
      POSTGRES_PASSWORD: dev_password

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U onedep -d onedep
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: onedep-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - 'yes'

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
