name: onedep-prod

x-api-image: &api-image
  image: ${ONEDEP_API_IMAGE:?Set ONEDEP_API_IMAGE in .env.production}
  build:
    context: .
    target: api

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: onedep
      POSTGRES_USER: onedep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U onedep -d onedep']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api-image
    restart: 'no'
    command: [pnpm, exec, prisma, migrate, deploy, --config, prisma7.config.ts]
    environment:
      DATABASE_URL: postgresql://onedep:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/onedep?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://onedep:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/onedep?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /data/uploads
      ONEDEP_PYTHON: ${ONEDEP_PYTHON:?Set ONEDEP_PYTHON in .env.production}
      GEMMI_TIMEOUT_MS: ${GEMMI_TIMEOUT_MS:?Set GEMMI_TIMEOUT_MS in .env.production}
      GEMMI_MAX_OUTPUT_BYTES: ${GEMMI_MAX_OUTPUT_BYTES:?Set GEMMI_MAX_OUTPUT_BYTES in .env.production}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "const r = await fetch('http://127.0.0.1:3000/api/health'); if (!r.ok) throw new Error('Health HTTP ' + r.status);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ${ONEDEP_WEB_IMAGE:?Set ONEDEP_WEB_IMAGE in .env.production}
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '${WEB_BIND_ADDRESS:?Set WEB_BIND_ADDRESS in .env.production}:${WEB_PORT:?Set WEB_PORT in .env.production}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
