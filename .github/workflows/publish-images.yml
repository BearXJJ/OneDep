name: Publish production images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=onedep-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=onedep-${{ matrix.target }}
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/bearxjj/onedep-{0}:main', matrix.target) || '' }}
            ghcr.io/bearxjj/onedep-${{ matrix.target }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BearXJJ/OneDep
            org.opencontainers.image.revision=${{ github.sha }}
